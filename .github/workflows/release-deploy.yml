name: Build and Deploy to SMB Share

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SHARE_PATH: '\\103.119.101.158\wwwroot'
  APP_NAME: 'interview-mcq-api'
  DEPLOY_DIR: 'deploy_${{ github.run_number }}'
  PROJECT_DIR: 'interview-mcq-api/KowQuestAndAns/KowQuestAndAns'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Verify project structure
      run: |
        Write-Output "Current directory: $(Get-Location)"
        cd ${{ env.PROJECT_DIR }}
        dir
      shell: powershell

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}

    - name: Build Release
      run: dotnet publish -c Release -o ../../../publish --no-restore
      working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}

    - name: Create deployment package
      run: |
        $version = "$(Get-Date -Format 'yyyyMMdd')-${{ github.run_number }}"
        $zipName = "${{ env.APP_NAME }}_$version.zip"
        Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath $zipName -Force
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
        echo "ZIP_PATH=${{ github.workspace }}/$zipName" >> $env:GITHUB_ENV
      working-directory: ${{ github.workspace }}
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: ${{ github.workspace }}/${{ env.APP_NAME }}_*.zip

  deploy:
    needs: build
    runs-on: windows-latest
    environment: production

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: release-package
        path: ${{ github.workspace }}

    - name: Deploy to SMB share
      run: |
        try {
            # Connect to SMB share
            $securePassword = ConvertTo-SecureString "${{ secrets.SMB_PASSWORD }}" -AsPlainText -Force
            $credential = New-Object System.Management.Automation.PSCredential ("${{ secrets.SMB_USERNAME }}", $securePassword)
            New-PSDrive -Name "DeployDrive" -PSProvider "FileSystem" -Root "${{ env.SHARE_PATH }}" -Credential $credential -Persist

            # Set paths
            $backupDir = "DeployDrive:\backups\${{ env.DEPLOY_DIR }}"
            $targetDir = "DeployDrive:\${{ env.APP_NAME }}"
            $zipPath = "${{ github.workspace }}\${{ env.APP_NAME }}_*.zip"
            
            # Verify zip exists
            if (-not (Test-Path $zipPath)) {
                throw "Zip file not found at $zipPath"
            }

            # Create backup
            New-Item -ItemType Directory -Path $backupDir -Force
            if (Test-Path $targetDir) {
                Copy-Item -Path "$targetDir\*" -Destination $backupDir -Recurse -Force
            }

            # Clean target directory
            if (Test-Path $targetDir) {
                Remove-Item "$targetDir\*" -Recurse -Force
            }
            else {
                New-Item -ItemType Directory -Path $targetDir -Force
            }

            # Deploy new version
            Expand-Archive -Path $zipPath -DestinationPath $targetDir -Force

            # Verify deployment
            $testFile = "$targetDir\appsettings.json"
            if (-not (Test-Path $testFile)) {
                throw "Deployment verification failed - appsettings.json not found"
            }

            Write-Output "Deployment completed successfully to $targetDir"
        }
        catch {
            Write-Error "Deployment failed: $_"
            exit 1
        }
        finally {
            # Cleanup
            if (Get-PSDrive -Name "DeployDrive" -ErrorAction SilentlyContinue) {
                Remove-PSDrive -Name "DeployDrive" -Force
            }
            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
        }
      shell: powershell
      env:
        SMB_USERNAME: ${{ secrets.SMB_USERNAME }}
        SMB_PASSWORD: ${{ secrets.SMB_PASSWORD }}
